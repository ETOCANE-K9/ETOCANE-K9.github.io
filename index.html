<!DOCTYPE html>

<html lang="es-MX">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>1ra Competencia de Obediencia - Etocane K-9</title>
<style>
        /* ================================================================
           ESTILOS GENERALES
           ================================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: #f0f4f8;
            color: #1a2b3c;
            line-height: 1.6;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .card,
        .card-bienvenida,
        .card-objetivo,
        .card-premiacion,
        .card-informes {
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            width: 100%;
            box-sizing: border-box;
        }

        .card {
            background: white;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .card-bienvenida {
            background: linear-gradient(135deg, #e0f4f7 0%, #ffffff 100%);
            border-left: 8px solid #2a9dab;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
        }

        .card-objetivo {
            background: #1a7a85;
            color: #ffffff;
            border: 2px solid #2a9dab;
        }

        .card-premiacion {
            background: #1a7a85;
            color: #ffffff;
            border: 2px solid #2a9dab;
            text-align: center;
        }

        .card-informes {
            text-align: center;
            background: #e0f4f7;
            border: 2px solid #2a9dab;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 20px;
            color: #0a2a3a;
            border-left: 6px solid #2a9dab;
            padding-left: 18px;
        }

        h2.centrado {
            border-left: none;
            text-align: center;
            padding-left: 0;
        }

        h2.sin-borde {
            border-left: none;
            padding-left: 0;
        }

        h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 25px 0 10px 0;
            color: #0a2a3a;
        }

        /* ================================================================
           PORTADA
           ================================================================ */
        .portada {
            background-image: url('fondo.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            border-radius: 30px;
            padding: 40px;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            width: 100%;
            box-sizing: border-box;
        }

        .portada::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.50);
            border-radius: 30px;
            z-index: 1;
        }

        .portada>* {
            position: relative;
            z-index: 2;
        }

        .portada .logos {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 25px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .portada .logos img {
            max-height: 80px;
            width: auto;
            object-fit: contain;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.85);
            padding: 4px 10px;
        }

        .portada .afiliacion {
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.85);
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
            padding-bottom: 10px;
        }

        .portada .afiliacion strong {
            color: #f5c842;
            font-weight: 600;
        }

        .portada .numero-concurso {
            font-size: 3.8rem;
            font-weight: 900;
            color: #ffe066;
            line-height: 1;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .portada .numero-concurso small {
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.8);
            vertical-align: super;
        }

        .portada h1 {
            color: white;
            font-size: 3.5rem;
            font-weight: 900;
            margin: 2px 0;
            line-height: 1.1;
            letter-spacing: 3px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .portada .subtitulo {
            font-size: 1.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.9);
            margin: 2px 0 15px;
            letter-spacing: 10px;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.5);
        }

        .portada .valores {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin: 12px 0;
        }

        .portada .valores span {
            background: rgba(255, 255, 255, 0.12);
            padding: 5px 25px;
            border-radius: 50px;
            font-size: 0.9rem;
            letter-spacing: 2px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 300;
            backdrop-filter: blur(4px);
            color: white;
        }

        .portada .fecha-lugar {
            display: flex;
            justify-content: center;
            gap: 35px;
            flex-wrap: wrap;
            margin: 15px 0 18px;
        }

        .portada .fecha-lugar div {
            background: rgba(255, 255, 255, 0.08);
            padding: 8px 28px;
            border-radius: 50px;
            font-size: 1.05rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            color: white;
        }

        .portada .fecha-lugar div strong {
            color: white;
            font-weight: 600;
        }

        .portada .frase {
            font-size: 1.05rem;
            font-style: italic;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 18px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 16px;
            letter-spacing: 1px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* ================================================================
           BIENVENIDA
           ================================================================ */
        .bienvenida-texto {
            font-size: 1.05rem;
            line-height: 1.8;
            color: #1e2b3a;
        }

        .bienvenida-texto strong {
            color: #0a2a3a;
        }

        .bienvenida-texto .destacado {
            color: #2a9dab;
            font-weight: 700;
        }

        /* ================================================================
           PILARES - IMÁGENES CON URLS CORREGIDAS
           ================================================================ */
        .bienvenida-pilares {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 20px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }

        .bienvenida-pilares .pilar {
            background: white;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
            border-top: 4px solid #2a9dab;
        }

        .bienvenida-pilares .pilar img {
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 12px;
            object-fit: cover;
            display: block;
            margin: 0 auto;
        }

        .bienvenida-pilares .pilar h4 {
            color: #0a2a3a;
            margin: 8px 0 4px;
        }

        .bienvenida-pilares .pilar p {
            font-size: 0.9rem;
            color: #4a5f6e;
            margin: 0;
        }

        /* ================================================================
           ICONOS DE REDES SOCIALES - CON EMOJIS (FUNCIONAN EN MÓVIL)
           ================================================================ */
        .social-icons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .social-icons a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            transition: transform 0.2s;
            font-weight: bold;
        }

        .social-icons a:hover {
            transform: scale(1.1);
        }

        .social-icons .fb { background: #1877f2; }
        .social-icons .wa { background: #25d366; }
        .social-icons .ig { background: #e4405f; }
        .social-icons .copy { background: #2a9dab; }

        /* ================================================================
           CONTENIDO (ÍNDICE)
           ================================================================ */
        .indice {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 10px 0;
        }

        .indice-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            background: #f7f9fc;
            border-radius: 10px;
            font-size: 0.9rem;
            color: #0a2a3a;
            text-decoration: none;
            transition: 0.2s;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .indice-item:hover {
            border-color: #2a9dab;
            background: #e0f4f7;
            transform: translateX(4px);
        }

        .indice-item .num {
            font-weight: 800;
            color: #2a9dab;
        }

        .indice-item i {
            color: #2a9dab;
            margin-right: 4px;
        }

        /* ================================================================
           CATEGORÍAS
           ================================================================ */
        .categoria-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-top: 15px;
        }

        .categoria-card {
            background: white;
            border-radius: 20px;
            padding: 25px 25px 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border-top: 6px solid #2a9dab;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .categoria-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 35px rgba(0, 0, 0, 0.1);
        }

        .categoria-card.nivel-2 {
            border-top-color: #f18f01;
        }

        .categoria-card.nivel-3 {
            border-top-color: #f5c842;
        }

        .categoria-card .nivel-badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 2px;
            padding: 3px 16px;
            border-radius: 50px;
            background: #2a9dab;
            color: white;
            align-self: flex-start;
            margin-bottom: 8px;
        }

        .categoria-card .nivel-badge.naranja {
            background: #f18f01;
        }

        .categoria-card .nivel-badge.dorado {
            background: #f5c842;
            color: #0a2a3a;
        }

        .categoria-card h3 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #0a2a3a;
            margin: 0 0 6px 0;
        }

        .categoria-card .descripcion {
            font-size: 0.95rem;
            color: #4a5f6e;
            margin-bottom: 15px;
            flex-grow: 0;
        }

        .categoria-card .lista-ejercicios {
            list-style: none;
            padding: 0;
            margin: 0 0 15px 0;
            flex-grow: 1;
        }

        .categoria-card .lista-ejercicios li {
            padding: 6px 0 6px 28px;
            border-bottom: 1px solid #f0f4f8;
            font-size: 0.92rem;
            color: #1e2b3a;
            position: relative;
        }

        .categoria-card .lista-ejercicios li:last-child {
            border-bottom: none;
        }

        .categoria-card .lista-ejercicios li::before {
            content: "🐾";
            position: absolute;
            left: 0;
            top: 6px;
            font-size: 0.9rem;
        }

        .categoria-card.nivel-2 .lista-ejercicios li::before {
            content: "🐕";
        }

        .categoria-card.nivel-3 .lista-ejercicios li::before {
            content: "⭐";
        }

        .categoria-card .puntos-max {
            display: inline-block;
            background: #f18f01;
            color: white;
            font-weight: 700;
            padding: 4px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            align-self: flex-start;
            margin-top: 5px;
        }

        .categoria-card .btn-ver-ejercicios {
            display: inline-block;
            background: #2a9dab;
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            margin-top: 12px;
            transition: 0.2s;
            border: none;
            cursor: pointer;
            align-self: flex-start;
        }

        .categoria-card .btn-ver-ejercicios:hover {
            background: #0a2a3a;
            transform: scale(1.03);
        }

        .categoria-card .btn-ver-ejercicios i {
            margin-right: 8px;
        }

        .categoria-card .reglamento-toggle {
            background: #e0f4f7;
            border: none;
            border-radius: 10px;
            padding: 10px 16px;
            margin-top: 15px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            font-weight: 600;
            color: #0a2a3a;
            transition: 0.2s;
            width: 100%;
            text-align: left;
        }

        .categoria-card .reglamento-toggle:hover {
            background: #b2e6ed;
        }

        .categoria-card .reglamento-toggle i {
            transition: 0.3s;
        }

        .categoria-card .reglamento-toggle.activo i {
            transform: rotate(180deg);
        }

        .categoria-card .reglamento-contenido {
            display: none;
            background: #f7f9fc;
            border-radius: 12px;
            padding: 16px 18px;
            margin-top: 10px;
            max-height: 400px;
            overflow-y: auto;
            border: 1px solid #e9edf2;
            font-size: 0.88rem;
            line-height: 1.7;
            color: #1e2b3a;
        }

        .categoria-card .reglamento-contenido.mostrar {
            display: block;
        }

        .categoria-card .reglamento-contenido strong {
            color: #0a2a3a;
        }

        .categoria-card .reglamento-contenido .regla-item {
            padding: 6px 0;
            border-bottom: 1px solid #e9edf2;
        }

        .categoria-card .reglamento-contenido .regla-item:last-child {
            border-bottom: none;
        }

        /* ================================================================
           MODAL EJERCICIOS
           ================================================================ */
        .modal-ejercicios {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-ejercicios.mostrar {
            display: flex;
        }

        .modal-ejercicios .modal-contenido {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 700px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-ejercicios .modal-contenido .cerrar-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            background: none;
            border: none;
            cursor: pointer;
            color: #0a2a3a;
        }

        .modal-ejercicios .modal-contenido .ejercicio-detalle {
            display: flex;
            gap: 15px;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #e9edf2;
        }

        .modal-ejercicios .modal-contenido .ejercicio-detalle:last-child {
            border-bottom: none;
        }

        .modal-ejercicios .modal-contenido .ejercicio-detalle .icono {
            font-size: 2.5rem;
            min-width: 50px;
            text-align: center;
        }

        .modal-ejercicios .modal-contenido .ejercicio-detalle .info {
            flex: 1;
        }

        .modal-ejercicios .modal-contenido .ejercicio-detalle .info h4 {
            font-size: 1rem;
            color: #0a2a3a;
            margin: 0;
        }

        .modal-ejercicios .modal-contenido .ejercicio-detalle .info p {
            font-size: 0.85rem;
            color: #4a5f6e;
            margin: 2px 0 0;
        }

        .modal-ejercicios .modal-contenido .ejercicio-detalle .puntos {
            background: #f18f01;
            color: white;
            font-weight: 700;
            padding: 2px 14px;
            border-radius: 50px;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        /* ================================================================
           REGLAMENTO - CARDS
           ================================================================ */
        .regla-card {
            background: #f7f9fc;
            border-radius: 12px;
            padding: 15px 18px;
            border-left: 4px solid #2a9dab;
            transition: 0.2s;
        }

        .regla-card:hover {
            background: #e0f4f7;
        }

        .regla-card .icono-regla {
            font-size: 1.8rem;
            margin-bottom: 4px;
        }

        .regla-card p {
            font-size: 0.92rem;
            color: #1e2b3a;
            margin: 0;
        }

        .regla-card p strong {
            color: #0a2a3a;
        }

        .regla-card.success {
            border-left-color: #2e7d32;
            background: #e8f5e9;
        }

        .regla-card.warning {
            border-left-color: #f18f01;
            background: #fff8e1;
        }

        .regla-card.danger {
            border-left-color: #d32f2f;
            background: #fce4ec;
        }

        /* ================================================================
           PREMIACIÓN
           ================================================================ */
        .premios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .premio-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .premio-card h3 {
            color: #f5c842;
            font-size: 1.3rem;
            margin-bottom: 10px;
        }

        .premio-card .lugar {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin: 5px 0;
        }

        .premio-card .monto {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.9);
            font-weight: 600;
        }

        /* ================================================================
           INSCRIPCIONES
           ================================================================ */
        .formulario-google {
            background: #f7f9fc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 15px;
            text-align: center;
        }

        .formulario-google .btn-abrir-form {
            display: inline-block;
            background: #f18f01;
            color: white;
            padding: 16px 50px;
            border-radius: 50px;
            font-size: 1.3rem;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
            margin: 10px 0;
            box-shadow: 0 4px 20px rgba(241, 143, 1, 0.35);
        }

        .formulario-google .btn-abrir-form:hover {
            background: #0a2a3a;
            transform: scale(1.05);
            box-shadow: 0 6px 30px rgba(241, 143, 1, 0.4);
        }

        .formulario-google .btn-abrir-form i {
            margin-right: 12px;
        }

        /* ================================================================
           MAYORES INFORMES
           ================================================================ */
        .btn-opinion {
            display: inline-block;
            background: #2a9dab;
            color: white;
            padding: 14px 40px;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
            margin-top: 15px;
            box-shadow: 0 4px 20px rgba(42, 157, 171, 0.3);
        }

        .btn-opinion:hover {
            background: #0a2a3a;
            transform: scale(1.03);
        }

        .btn-opinion i {
            margin-right: 10px;
        }

        /* ================================================================
           UTILERÍAS
           ================================================================ */
        .aviso {
            background: #fff8e1;
            border-radius: 12px;
            padding: 15px 20px;
            border-left: 6px solid #f5c842;
            margin: 15px 0;
            font-size: 0.9rem;
            color: #4a3a1a;
        }

        .aviso strong {
            color: #0a2a3a;
        }

        .badge {
            background: #2a9dab;
            color: white;
            font-size: 0.7rem;
            font-weight: 700;
            padding: 3px 14px;
            border-radius: 50px;
            display: inline-block;
            letter-spacing: 1px;
        }

        .footer {
            text-align: center;
            padding: 30px 0 20px;
            color: #6f8a9c;
            font-size: 0.85rem;
            border-top: 2px solid #e9edf2;
            margin-top: 40px;
        }

        .footer strong {
            color: #0a2a3a;
        }

        html {
            scroll-behavior: smooth;
        }

        /* ================================================================
           📌 VERSIÓN MÓVIL (RESPONSIVE)
           ================================================================ */
        @media (max-width: 768px) {
            .portada {
                padding: 20px;
                min-height: 400px;
            }

            .portada h1 {
                font-size: 2.2rem !important;
                white-space: normal !important;
                letter-spacing: 2px;
            }

            .portada .numero-concurso {
                font-size: 2.8rem;
            }

            .portada .numero-concurso small {
                font-size: 1.4rem;
            }

            .portada .subtitulo {
                font-size: 1.2rem;
                letter-spacing: 5px;
            }

            .portada .logos img {
                max-height: 45px;
            }

            .portada .fecha-lugar {
                gap: 12px;
            }

            .portada .fecha-lugar div {
                font-size: 0.8rem;
                padding: 5px 14px;
            }

            .portada .valores span {
                font-size: 0.7rem;
                padding: 3px 14px;
            }

            .portada .afiliacion {
                font-size: 0.7rem;
            }

            .card,
            .card-bienvenida,
            .card-objetivo,
            .card-premiacion,
            .card-informes {
                padding: 20px;
            }

            .bienvenida-pilares {
                grid-template-columns: 1fr;
                max-width: 100%;
            }

            .bienvenida-pilares .pilar img {
                max-width: 100%;
                height: auto;
            }

            .indice {
                grid-template-columns: 1fr;
            }

            .categoria-grid {
                grid-template-columns: 1fr;

<script>
        function abrirModal(tipo) {
            var modalId = 'modal-' + tipo;
            var modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.add('mostrar');
                document.body.style.overflow = 'hidden';
            }
        }

        function cerrarModal(modalId) {
            var modal = document.getElementById(modalId);
            if (modal) {
                modal.classList.remove('mostrar');
                document.body.style.overflow = 'auto';
            }
        }

        // Cerrar modal al hacer clic fuera del contenido
        document.querySelectorAll('.modal-ejercicios').forEach(function(modal) {
            modal.addEventListener('click', function(e) {
                if (e.target === this) {
                    this.classList.remove('mostrar');
                    document.body.style.overflow = 'auto';
                }
            });
        });

        function toggleReglamento(boton) {
            var contenido = boton.nextElementSibling;
            if (contenido) {
                contenido.classList.toggle('mostrar');
                boton.classList.toggle('activo');
            }
        }


        function compartirWhatsApp(e) {
            if (e) e.preventDefault();
            var url = window.location.href;
            var texto = '🐾 Competencia de Obediencia Canina Etocane K-9';
            if (window.location.protocol === 'file:') {
                alert('La página aún está abierta como archivo local. Cuando la publiques, este botón compartirá el enlace público por WhatsApp.');
                return;
            }
            window.open('https://wa.me/?text=' + encodeURIComponent(texto + '\n' + url), '_blank');
        }

        function compartirFacebook(e) {
            if (e) e.preventDefault();
            var url = window.location.href;
            if (window.location.protocol === 'file:') {
                alert('La página aún está abierta como archivo local. Cuando la publiques, este botón compartirá el enlace público en Facebook.');
                return;
            }
            window.open('https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(url), '_blank');
        }

        function copiarEnlace() {
            var url = window.location.href;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function() {
                    alert('✅ ¡Enlace copiado al portapapeles! Compártelo en tus redes sociales.');
                }).catch(function() {
                    fallbackCopiarEnlace(url);
                });
            } else {
                fallbackCopiarEnlace(url);
            }
        }

        function fallbackCopiarEnlace(url) {
            var input = document.createElement('input');
            input.value = url;
            document.body.appendChild(input);
            input.select();
            document.execCommand('copy');
            document.body.removeChild(input);
            alert('✅ ¡Enlace copiado al portapapeles!');
        }
    </script>
